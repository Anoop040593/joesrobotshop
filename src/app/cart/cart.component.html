@let hasCartItems = cartItems().length > 0;
<h1 class="header">Your Cart</h1>
@if (hasCartItems) {
  <button (click)="checkout.scrollIntoView({ behavior: 'smooth' })">
    Proceed to Checkout!
  </button>
}
<!--scrollIntoView() is not Angular Specific, Present in DOM elements and is a JS method-->
<ul>
  @for (product of cartItems(); track product.id) {
    <li>
      <bot-product-details
        mode="cart"
        (removeFromCart)="removeFromCart($event)"
        [product]="product"
      />
      <!-- <button class="remove" (click)="removeFromCart(product)">Remove</button> -->
      <!--content projection-->
      <!-- </bot-product-details> -->
    </li>
  } @empty {
    <h2>You have no items in the cart!</h2>
  }
</ul>
<span #checkout>
  @if (hasCartItems) {
    <!--Here #checkout is a template reference variable-->
    <button class="cta">Checkout</button>
  }
</span>
